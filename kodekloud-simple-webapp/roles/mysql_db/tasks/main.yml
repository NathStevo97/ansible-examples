---
# tasks file for mysql_db
- name: "Install MySQL Community Repository"
  ansible.builtin.yum:
    name: "http://repo.mysql.com/mysql-community-release-el7-5.noarch.rpm"
    state: present

- name: "Install MySQL database"
  ansible.builtin.yum:
     name: "{{ item }}"
     state: present
  loop:
  - "mysql-server"
  - "mysql-devel"

- name: "Create MySQL configuration file"
  copy:
    content: |
      [client]
      user=root
      password="@targ8et"
    dest: "/etc/.my.cnf"

- name: "Start MySQL DB Service"
  ansible.builtin.service:
    name: mysqld
    state: started
    enabled: yes

- name: "Install MYSQL-Python Package"
  ansible.builtin.yum:
    name: "MySQL-python"
    state: present

- name: "Install pip"
  ansible.builtin.yum:
    name: "python-pip"
    state: present

- name: "Create Application Database"
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: present

- name: "Upgrade MySQL Database"
  ansible.builtin.shell: mysql_upgrade --force

- name: "Create Application DB User"
  mysql_user:
    name: "{{ db_user }}"
    password: "{{ db_user_password }}"
    #host: "{{ web_server_ip }}"
    priv: '*.*:ALL'
    state: present
