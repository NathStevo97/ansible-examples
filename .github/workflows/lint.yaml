# .github/workflows/ansible-lint.yml
name: ansible-lint
on: [push, pull_request]
jobs:
  build:
    name: Ansible Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run ansible-lint
        uses: ansible/ansible-lint@b5609548ec49df35aabb89b6cb71de8f398cd195 # v26.11.1
        with:
          args: ""
          setup_python: "true"
          python_version: "3.14"
          working_directory: ""
          requirements_file: ""
